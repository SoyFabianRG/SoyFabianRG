name: Generate Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: # Permite la ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#25be6a&color_dots=#161616,#1f3328,#254d38,#26734d,#25be6a
            dist/github-contribution-grid-snake-dark.svg?color_snake=#25be6a&color_dots=#161616,#1f3328,#254d38,#26734d,#25be6a

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
